<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/homepage.css">
</head>
<body>

<div class="page">
  <!-- Topbar: misma estructura, mismo orden de botones en las 4 páginas -->
  <header class="topbar noise">
    <a href="homepage.html" class="brand">
      <img src="gamevault_logo_transparent.png" alt="GV">
      <span>GameVault</span>
    </a>
    <nav class="links">
      <a href="homepage.html">Home</a>
      <a href="review.html">Reviews</a>
      <a href="vault.html">My Vault</a>
      <a href="#">Games</a>
      <a href="#">About</a>
    </nav>
    <div class="topbar-right">
      <div class="search-box search-box--compact">
        <input type="text" placeholder="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <a href="login.html" class="nav-avatar">👤</a>
    </div>
  </header>

  <section class="hero hero-backdrop noise">
    <div class="hero-content">
      <div class="hero-text">
        <div class="logo">GameVault</div>
        <p class="tagline">Collect, rate, discover — powered by AI</p>
      </div>
    </div>

    <div class="cta-row">
      <a href="login.html" class="btn-primary">Create Account</a>
    </div>
  </section>

  <section class="trending">
    <div class="trending-header">
      <h2>Trending Now</h2>
      <a href="#">See more</a>
    </div>
    <div class="card-grid card-grid--5">
      <div class="game-cover"></div>
      <div class="game-cover"></div>
      <div class="game-cover"></div>
      <div class="game-cover"></div>
      <div class="game-cover"></div>
    </div>
  </section>
</div>

</body>
</html>
