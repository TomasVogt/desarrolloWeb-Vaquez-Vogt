<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/gamevault_logo_transparente.ico" type="image/x-icon">
  <title>GameVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/homepage.css">
</head>

<body>

  <header class="topbar noise">
    <a href="homepage.html" class="brand">
      <img src="gamevault_logo_transparent.png" alt="GV">
      <span>GameVault</span>
    </a>

    <div class="topbar-right">
      <nav class="links">
        <a href="homepage.html">Home</a>
        <a href="vault.html">My Vault</a>
        <a href="about.html">About</a>
      </nav>

      <div class="user-menu" id="userMenu">
        <button type="button" class="nav-avatar" id="userMenuBtn" aria-haspopup="true" aria-expanded="false"
          aria-label="Menú de usuario">👤︎</button>
        <div class="user-dropdown" role="menu">
          <a href="profile.html" role="menuitem" id="profileLink">Mi perfil</a>
          <a href="#" role="menuitem" id="logoutBtn">Logout</a>
        </div>
      </div>
    </div>
  </header>

  <section class="hero hero-backdrop hero-photo noise">
    <div class="hero-content">
      <div class="hero-text">
        <div class="logo">GameVault</div>
        <p class="tagline">Collect, rate, discover — powered by AI</p>
        <div class="cta-row" id="heroCtaContainer">
          <a href="login.html" class="btn-primary">Create Account</a>
        </div>
      </div>

      <div class="search-box">
        <input type="text" placeholder="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
    </div>
  </section>

  <section class="game-category bg-trending">
    <div class="category-header">
      <h2>Trending Games</h2>
      <a href="#">See more</a>
    </div>
    <div class="card-grid" id="trending-grid"></div>
  </section>

  <section class="game-category bg-new">
    <div class="category-header">
      <h2>New Releases</h2>
      <a href="#">See more</a>
    </div>
    <div class="card-grid" id="new-releases-grid"></div>
  </section>

  <section class="game-category bg-playstation">
    <div class="category-header">
      <h2>PlayStation Exclusives</h2>
      <a href="#">See more</a>
    </div>
    <div class="card-grid" id="playstation-grid"></div>
  </section>

  <section class="game-category bg-xbox">
    <div class="category-header">
      <h2>Xbox Exclusives</h2>
      <a href="#">See more</a>
    </div>
    <div class="card-grid" id="xbox-grid"></div>
  </section>

  <section class="game-category bg-nintendo">
    <div class="category-header">
      <h2>Nintendo Exclusives</h2>
      <a href="#">See more</a>
    </div>
    <div class="card-grid" id="nintendo-grid"></div>
  </section>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/search.js"></script>
</body>

</html>
