<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — GameVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/gamevault_logo_transparente.ico" type="image/x-icon">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-card">
    <a href="homepage.html" class="brand-mark" title="Volver al inicio">
      <img src="gamevault_logo_transparent.png" alt="GameVault" class="brand-mark">
    </a>
    <h1 id="authTitle">Inicia sesión con tu cuenta de<br>GameVault</h1>

    <form id="authForm">
      <input class="field" type="email" id="email" name="email" placeholder="Correo electrónico"
             autocomplete="email" required data-modes="login register forgot">
      <input class="field" type="password" id="password" name="password" placeholder="Contraseña"
             autocomplete="current-password" required data-modes="login register reset">
      <input class="field" type="password" id="confirmPassword" name="confirmPassword" placeholder="Repetí la contraseña"
             autocomplete="new-password" required data-modes="register reset">

      <div class="options-row" data-modes="login">
        <label class="remember">
          <input type="checkbox" id="remember" checked>
          Recordarme
        </label>
        <a href="#" data-goto="forgot">¿Olvidaste tu contraseña?</a>
      </div>

      <p id="formMessage" class="form-message is-hidden" role="alert" aria-live="polite"></p>

      <button type="submit" class="btn-primary" id="submitBtn">Continuar</button>
      <button type="button" class="btn-secondary" data-goto="register" data-modes="login">Crear cuenta</button>
    </form>

    <p id="envNotice" class="form-message form-message--warning is-hidden" style="margin-top:14px"></p>

    <p class="signup-hint" id="authHint"></p>
  </div>


  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
