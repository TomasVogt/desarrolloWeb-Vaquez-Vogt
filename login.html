<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — GameVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- mismo mecanismo de fondo que en homepage.html -->
  <div class="login-backdrop hero-backdrop noise-fixed"></div>

  <div class="login-card">
    <a href="homepage.html" class="brand-mark" title="Volver al inicio">
      <img src="gamevault_logo_transparent.png" alt="GameVault" class="brand-mark">
    </a>
    <h1>Inicia sesión con tu cuenta de<br>GameVault</h1>

    <form action="#" method="post">
      <input class="field" type="email" placeholder="Correo electrónico" required>
      <input class="field" type="password" placeholder="Contraseña" required>

      <div class="options-row">
        <label class="remember">
          <input type="checkbox">
          Recordarme
        </label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-primary">Continuar</button>
    </form>

    <p class="signup-hint">¿No tenés cuenta? <a href="#">Creá una</a></p>
  </div>

</body>
</html>
