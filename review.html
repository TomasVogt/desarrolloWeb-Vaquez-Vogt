<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Cargando... — GameVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/gamevault_logo_transparente.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/review.css">
</head>

<body>

  <header class="topbar noise">
    <a href="homepage.html" class="brand">
      <img src="gamevault_logo_transparent.png" alt="GV">
      <span>GameVault</span>
    </a>

    
    <div class="topbar-right">

      <nav class="links">
        <a href="homepage.html">Home</a>
        <a href="vault.html">My Vault</a>
        <a href="about.html">About</a>
      </nav>

      
      <div class="search-box search-box--compact">
        <input type="text" placeholder="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>

      <div class="user-menu" id="userMenu">
        <button type="button" class="nav-avatar" id="userMenuBtn" aria-haspopup="true" aria-expanded="false"
          aria-label="Menú de usuario">👤︎</button>
        <div class="user-dropdown" role="menu">
          <a href="profile.html" role="menuitem" id="profileLink">Mi perfil</a>
          <a href="#" role="menuitem" id="logoutBtn">Logout</a>
        </div>
      </div>

    </div>
  </header>

  <div class="banner noise" id="game-banner"></div>

  <div class="content">
    <div class="left-col">
      
      <div class="cover" id="game-cover"></div>

      <div class="platform-list">
        <h3>¿Dónde jugar?</h3>
        <div id="game-platforms"></div>
      </div>
    </div>
    

    <div class="main-col">
      <h1 class="game-title" id="game-title">Cargando...</h1>
      <p class="game-year" id="game-year">-</p>
      <div class="description" id="game-description">
        Obteniendo información del servidor...
      </div>

      <div class="popular-reviews">
        <h2>Popular Reviews</h2>

        <div class="review-card" id="reviewFormContainer" style="margin-bottom: 25px; display: none;">
          <h3>Escribe tu reseña</h3>
          <form id="submitReviewForm">
            <div style="margin-bottom: 10px;">
              <label for="reviewRating">Calificación (1 al 5 estrellas)</label>
              <select id="reviewRating" class="field">
                <option value="5">★★★★★ (5)</option>
                <option value="4">★★★★☆ (4)</option>
                <option value="3">★★★☆☆ (3)</option>
                <option value="2">★★☆☆☆ (2)</option>
                <option value="1">★☆☆☆☆ (1)</option>
              </select>
            </div>
            <div style="margin-bottom: 12px;">
              <textarea id="reviewComment" class="field" placeholder="¿Qué te pareció el juego?" rows="3" required
                maxlength="2000"></textarea>
            </div>
            <button type="submit" class="btn-primary" id="sendReviewBtn">Publicar reseña</button>
          </form>
        </div>

        <div id="reviewsList"></div>
      </div>
    </div>

    <div class="sidebar">
      <div class="side-panel">
        <h3>Ratings</h3>

        <div class="rating-average">
          <span class="stars" id="game-stars">★★★★★</span>
          <span class="score" id="game-rating">0.0</span>
        </div>
        <div class="rating-count" id="game-rating-count">0 ratings</div>

        <div class="bar-row"><span>5</span>
          <div class="bar-track">
            <div class="bar-fill" id="bar-5" style="width: 0%;"></div>
          </div>
        </div>
        <div class="bar-row"><span>4</span>
          <div class="bar-track">
            <div class="bar-fill" id="bar-4" style="width: 0%;"></div>
          </div>
        </div>
        <div class="bar-row"><span>3</span>
          <div class="bar-track">
            <div class="bar-fill" id="bar-3" style="width: 0%;"></div>
          </div>
        </div>
        <div class="bar-row"><span>2</span>
          <div class="bar-track">
            <div class="bar-fill" id="bar-2" style="width: 0%;"></div>
          </div>
        </div>
        <div class="bar-row"><span>1</span>
          <div class="bar-track">
            <div class="bar-fill" id="bar-1" style="width: 0%;"></div>
          </div>
        </div>
      </div>
      <button type="button" class="btn-primary btn-vault" id="btn-add-vault">Add to Vault</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/review.js"></script>
  <script src="js/search.js"></script>
</body>

</html>
