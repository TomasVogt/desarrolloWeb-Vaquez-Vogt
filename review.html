<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Cargando... — GameVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/review.css">
</head>
<body>

<div class="page">
  <header class="topbar noise">
    <a href="homepage.html" class="brand">
      <img src="gamevault_logo_transparent.png" alt="GV">
      <span>GameVault</span>
    </a>
    <nav class="links">
      <a href="homepage.html">Home</a>
      <a href="review.html">Reviews</a>
      <a href="vault.html">My Vault</a>
      <a href="#">Games</a>
      <a href="#">About</a>
    </nav>
    <div class="topbar-right">
      <div class="search-box search-box--compact">
        <input type="text" placeholder="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <a href="login.html" class="nav-avatar">👤</a>
    </div>
  </header>

<!-- Banner para la imagen principal (background_image de RAWG) -->
  <div class="banner noise" id="game-banner"></div>

  <div class="content">
    <div class="left-col">
      <!-- Carátula (usaremos una imagen adicional si existe, o la misma principal) -->
      <div class="cover" id="game-cover"></div>
      
      <div class="platform-list">
        <h3>¿Dónde jugar?</h3>
        <!-- Las plataformas se inyectarán aquí -->
        <div id="game-platforms"></div>
      </div>
    </div>

    <div class="main-col">
      <h1 class="game-title" id="game-title">Cargando...</h1>
      <p class="game-year" id="game-year">-</p>
      <!-- RAWG devuelve HTML en la descripción, así que lo inyectaremos directamente -->
      <div class="description" id="game-description">
        Obteniendo información del servidor...
      </div>

      <div class="popular-reviews">
        <h2>Popular Reviews</h2>
        <!-- Las reviews requerirían otro endpoint, por ahora dejamos el diseño base -->
        <div class="review-card">
          <div class="review-head">
            <div class="review-avatar"></div>
            <span class="review-user">User</span>
            <span class="stars">★★★★★</span>
          </div>
          <p class="review-text">
            (Sistema de comentarios en desarrollo)
          </p>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="side-panel">
        <h3>Ratings RAWG</h3>
        <div class="rating-average">
          <!-- Representación visual simple de estrellas -->
          <span class="stars" id="game-stars">★★★★☆</span>
          <span class="score" id="game-rating">0.0</span>
        </div>
        <p class="rating-count" id="game-rating-count">0 ratings</p>
        
        <!-- Las barras de progreso por ahora son visuales -->
        <div class="bar-row"><span>5</span><div class="bar-track"><div class="bar-fill" style="width:70%"></div></div></div>
        <div class="bar-row"><span>4</span><div class="bar-track"><div class="bar-fill" style="width:45%"></div></div></div>
        <div class="bar-row"><span>3</span><div class="bar-track"><div class="bar-fill" style="width:20%"></div></div></div>
        <div class="bar-row"><span>2</span><div class="bar-track"><div class="bar-fill" style="width:10%"></div></div></div>
        <div class="bar-row"><span>1</span><div class="bar-track"><div class="bar-fill" style="width:5%"></div></div></div>
      </div>

      <div class="side-panel">
        <h3>My Vault</h3>
        <a href="vault.html" class="btn-primary">Añadir a mi Vault</a>
      </div>
    </div>
  </div>
</div>

<!-- Conectamos el script específico para la página de reviews -->
<script src="js/review.js"></script>
</body>
</html>
